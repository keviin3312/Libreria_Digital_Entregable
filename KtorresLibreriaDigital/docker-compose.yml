services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_libreria
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Abc.123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_libreria_digital
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=KtorresLibreriaDigitalDb;User Id=sa;Password=Abc.123;TrustServerCertificate=True;Encrypt=False
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:
